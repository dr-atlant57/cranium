name: CRANIO synthetic contact delivery check
on:
  push:
    branches: [product-reconstruction-v2]
    paths: ['tests/contact_delivery_once.py']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/contact_delivery_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-delivery-audit
          path: contact-delivery-audit.json
