name: CRANIO production acceptance
on:
  push:
    branches: [main]
    paths: ['tests/production_acceptance.py']
  workflow_dispatch:
    inputs:
      contact_probe:
        description: 'Explicitly submit two synthetic contact tests'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Public website acceptance
        env:
          CONTACT_PROBE: ${{ inputs.contact_probe || false }}
        run: |
          if [ "$CONTACT_PROBE" = 'true' ]; then python tests/production_acceptance.py --contact; else python tests/production_acceptance.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance
          path: production-acceptance.json
