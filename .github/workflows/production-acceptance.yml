name: CRANIO production acceptance
on:
  push:
    branches: [main]
    paths: ['tests/production_acceptance.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/production_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance
          path: production-acceptance.json
